<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>
@page{size:1280px 720px;margin:0}
*{box-sizing:border-box}
$fonts
body{margin:0;background:#e9ebef;color:#16181d;font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.slide{position:relative;width:1280px;height:720px;margin:24px auto;background:#fff;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.08);page-break-after:always;break-after:page}
header{position:absolute;left:64px;right:64px;top:30px;display:flex;align-items:center;gap:12px;font-size:15px;color:#4b5160}
header .idea{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .count{color:#9aa0ab;font-variant-numeric:tabular-nums}
.chip{display:inline-block;flex:none;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;letter-spacing:.01em}
.chip.existing{background:#e3f5ec;color:#0f6b44}
.chip.change{background:#ece7ff;color:#4b32c3}
.chip.conditional{background:#fff1d6;color:#8a5200;text-transform:uppercase;letter-spacing:.06em}
h2{position:absolute;left:64px;top:70px;margin:0;font-size:40px;line-height:1.1;letter-spacing:-.01em;display:flex;align-items:center;gap:16px}
.num{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#3b5bfd;color:#fff;font-size:22px}
.flow{position:absolute;left:64px;right:64px;top:64px;bottom:22px;display:flex;flex-direction:column}
.flow h2{position:static;display:block;flex:none;font-size:28px;line-height:1.15;letter-spacing:-.01em}
.flow .new{flex:none;margin:8px 0 20px;font-size:15px;line-height:1.35;color:#4b5160}
.flow .new p{margin:0 0 2px}
.flow footer{position:static;flex:none;margin-top:14px}
.flow .pending{flex:none;margin:12px 0 0;padding:6px 14px;background:#fff1d6;border-radius:10px;font-size:14px}
.row{flex:1 1 0;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:minmax(0,1fr) auto;grid-auto-columns:var(--col);column-gap:var(--gap);justify-content:center}
.step{display:contents}
.shot{position:relative;justify-self:center;height:min(100%,var(--h));aspect-ratio:var(--aspect)}
.step+.step .shot:before{content:"";position:absolute;left:calc((100% - var(--col) - var(--gap))/2 - 6px);top:calc(50% - 7px);border:7px solid transparent;border-left:12px solid #3b5bfd;border-right:0}
.n{position:absolute;left:-10px;top:-10px;z-index:2;width:28px;height:28px;border-radius:50%;background:#3b5bfd;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff}
.phone{position:absolute;inset:0;border-radius:22px;border:5px solid #16181d;background:#16181d;overflow:hidden;box-shadow:0 10px 26px rgba(22,24,29,.22)}
.phone img{display:block;width:100%;height:100%;object-fit:cover}
.shot.dim .phone{opacity:.35}
.ring{position:absolute;border:3px solid #3b5bfd;border-radius:8px}
.cap{margin-top:12px}
.cap b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280}
.cap p{margin:3px 0 0;font-size:13px;line-height:1.3}
footer{position:absolute;left:64px;right:64px;bottom:22px;font-size:14px;color:#4b5160;border-top:1px solid #e5e7eb;padding-top:10px}
.why{position:absolute;left:64px;right:64px;top:150px;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:16px 20px;font-size:16px}
.reach{grid-column:1/-1;margin:0;font-size:.875em;line-height:1.4;color:#4b5160}
.why-block{background:#f5f6f8;border-radius:16px;padding:18px 20px}
.why-block b{display:block;font-size:.8125em;text-transform:uppercase;letter-spacing:.06em;color:#6b7280}
.why-block p{margin:8px 0 0;font-size:1em;line-height:1.4}
.condition{grid-column:1/-1;background:#fff1d6;border-radius:16px;padding:12px 20px;font-size:1em}
.cover{padding:120px 96px}
.cover h1{margin:0 0 36px;font-size:52px;letter-spacing:-.02em}
.cover ol{margin:0;padding-left:28px;font-size:22px}
.cover li{margin:14px 0}
.cover li .chip{margin-right:12px;vertical-align:2px}
.cover .how{margin-top:36px;color:#6b7280;font-size:18px}
.score-body{position:absolute;left:64px;right:64px;top:128px;font-size:12px;line-height:15px}
.scores{border-collapse:collapse;width:100%;table-layout:fixed}
.scores th,.scores td{border:1px solid #e5e7eb;padding:3px 6px;text-align:left;vertical-align:top}
.scores th{background:#f5f6f8}
.scores th:nth-child(1){width:60px}.scores th:nth-child(2){width:400px}.scores th:nth-child(3){width:128px}.scores th:nth-child(4){width:56px}
.score-body h3{margin:14px 0 4px;font-size:15px}
.score-body ul{margin:0;padding-left:20px}
.watermark{position:fixed;left:0;top:300px;width:1280px;text-align:center;transform:rotate(-14deg);font-size:64px;font-weight:900;color:rgba(217,45,32,.16);pointer-events:none;z-index:99;letter-spacing:.04em}
@media print{body{background:#fff}.slide{margin:0;box-shadow:none}}
</style>
</head>
<body>
$slides
<script>
// A why slide whose text runs into its footer steps its text down 1px at a time, to 13px at the smallest; the stage's
// overflow check waits for this and reports whatever still doesn't fit.
document.fonts.ready.then(() => {
  for (const why of document.querySelectorAll('.why')) {
    const footer = why.closest('.slide').querySelector('footer');
    const floor = footer ? footer.getBoundingClientRect().top : Infinity;
    for (let px = 16; px > 13 && why.getBoundingClientRect().bottom > floor; px--) why.style.fontSize = (px - 1) + 'px';
  }
  document.documentElement.dataset.fitted = '';
});
</script>
</body>
</html>
