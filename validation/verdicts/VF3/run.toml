commit = "e56402e"
note = '''Before it, a396f94 made three edits after run 2's failures. It removed from kg-fitness-01 exactly the two claims judge_2 failed it on (c2), and run 3 passed it. It reworded c3 after judge_2 failed c3 on pd-g-brand-safety-flagrant, an offer only free users see whose reward is part of the paid plan; the new wording passes exactly that. It rewrote the pd-c3-flagrant fields that still told its base's free-user story. Changing a rubric clause and a known-good after seeing them fail is tuning on the validation set.'''
rubric = '''`c3_spares_payers` concerns users who pay for a plan the product model shows, and only offers they see. It fails if: the offer sits inside what paying users pay for (on a screen or in a feature only paying users get); paying users see the offer and it is pitched as more of what their plan sells, or its reward is something their plan already includes; or the plan removes ads and its members see the offer. Otherwise it passes: when the product model shows no paid plan; when paying users never see the offer, even if its reward is a slice of the plan (a sample for users who don't pay); and when the offer is for something outside their plan and sits outside what they pay for, whether it is shown to everyone or only to paying users, unless their plan removes ads.'''
replaced = ["validation/verdicts/VF3-42f9428", "validation/verdicts/VF3-9092006"]
