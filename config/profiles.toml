economics_mode = "annotate"   # annotate | gate
judges = ["judge_1", "judge_2"]  # every run; a judgment check they split on goes to a person
jev_backend = "typesafe"       # typesafe | adapter; env SIMULA_JEV_BACKEND overrides
validation_usd_cap = 20.0

# Exploration size is a run flag (--budget), never per app.
[budgets.deep]
actions = 80
wall_minutes = 25

[budgets.transfer]
actions = 40
wall_minutes = 12

# Generic words that mark obvious adult content on any app. Never a per-app list.
[content]
adult_keywords = ["nsfw", "18+", "explicit", "adult", "erotic", "lewd", "sexual"]

[caps_usd]
explore = 3.0
model = 4.0
mock = 25.0   # each batch's call holds its worst case, ~$2.72 (input + 128K output on Opus), only while in flight
qa = 12.0
propose = 6.0
judge = 8.0
flows = 8.0

# max_tokens: what the role's call asks for (the widest one, for a role with several calls); the stage code and
# `doctor --keys` both read it, so doctor probes each model the way the code calls it. A role with no max_tokens
# (pairwise) has no call yet and isn't probed.
[real.roles]
jev = { model = "jev-latest" }
explore_vision = { model = "claude-sonnet-5-5", effort = "low", max_tokens = 2000 }
model_meaning = { model = "claude-opus-5-5", effort = "high", max_tokens = 64000 }
mock_builder = { model = "claude-opus-5-5", effort = "xhigh", max_tokens = 128000 }
qa_critic = { model = "claude-sonnet-5-5", effort = "medium", max_tokens = 16000 }
qa_fixer = { model = "claude-opus-5-5", effort = "high", effort_last_round = "xhigh", max_tokens = 64000 }
proposer = { model = "claude-opus-5-5", effort = "high", max_tokens = 16000 }
propose_dedupe = { model = "claude-sonnet-5-5", effort = "low", max_tokens = 4000 }
# The judges ask one over stream_above (16000, checked with >), so their calls stream: a stall fails after 60 s idle
# with no SDK retries, and a reply lost mid-stream is still charged.
judge_1 = { model = "claude-sonnet-5-5", effort = "high", max_tokens = 16001 }
judge_2 = { model = "gpt-6-sol", effort = "high", declared_fallback = "gpt-6-luna", max_tokens = 16001 }
pairwise = { model = "claude-sonnet-5-5", effort = "low" }
flows_editor = { model = "claude-opus-5-5", effort = "high", max_tokens = 16000 }

[dev.roles]
jev = { model = "claude-haiku-4-5-20251001", backend = "adapter" }
explore_vision = { model = "claude-haiku-4-5-20251001", max_tokens = 2000 }
model_meaning = { model = "claude-haiku-4-5-20251001", max_tokens = 64000 }
mock_builder = { model = "claude-sonnet-5-5", effort = "low", max_tokens = 32000 }
qa_critic = { model = "claude-haiku-4-5-20251001", max_tokens = 16000 }
qa_fixer = { model = "claude-sonnet-5-5", effort = "low", max_tokens = 64000 }
proposer = { model = "claude-haiku-4-5-20251001", max_tokens = 16000 }
propose_dedupe = { model = "claude-haiku-4-5-20251001", max_tokens = 4000 }
judge_1 = { model = "claude-haiku-4-5-20251001", max_tokens = 16001 }
judge_2 = { model = "gpt-6-luna", effort = "low", max_tokens = 16001 }
pairwise = { model = "claude-haiku-4-5-20251001" }
flows_editor = { model = "claude-sonnet-5-5", effort = "low", max_tokens = 16000 }
