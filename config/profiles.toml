economics_mode = "annotate"   # annotate | gate
jev_backend = "typesafe"       # typesafe | adapter; env SIMULA_JEV_BACKEND overrides
validation_usd_cap = 20.0

# Exploration size is a run flag (--budget), never per app.
[budgets.deep]
actions = 80
wall_minutes = 25

[budgets.transfer]
actions = 40
wall_minutes = 12

# Generic words that mark obvious adult content on any app. Never a per-app list.
[content]
adult_keywords = ["nsfw", "18+", "explicit", "adult", "erotic", "lewd", "sexual"]

[caps_usd]
explore = 3.0
model = 4.0
mock = 8.0
qa = 12.0
propose = 6.0
judge = 8.0
flows = 8.0

[real.roles]
jev = { model = "jev-latest" }
explore_vision = { model = "claude-sonnet-5-5", effort = "low" }
model_meaning = { model = "claude-opus-5-5", effort = "high" }
mock_builder = { model = "claude-opus-5-5", effort = "xhigh", max_tokens = 128000 }
qa_critic = { model = "claude-sonnet-5-5", effort = "medium" }
qa_fixer = { model = "claude-opus-5-5", effort = "high", effort_last_round = "xhigh" }
proposer = { model = "claude-opus-5-5", effort = "high" }
judge_1 = { model = "claude-sonnet-5-5", effort = "high" }
judge_2 = { model = "gpt-6-sol", effort = "high", declared_fallback = "gpt-6-luna" }
pairwise = { model = "claude-sonnet-5-5", effort = "low" }
flows_editor = { model = "claude-opus-5-5", effort = "high" }

[dev.roles]
jev = { model = "claude-haiku-4-5-20251001", backend = "adapter" }
explore_vision = { model = "claude-haiku-4-5-20251001" }
model_meaning = { model = "claude-haiku-4-5-20251001" }
mock_builder = { model = "claude-sonnet-5-5", effort = "low", max_tokens = 32000 }
qa_critic = { model = "claude-haiku-4-5-20251001" }
qa_fixer = { model = "claude-sonnet-5-5", effort = "low" }
proposer = { model = "claude-haiku-4-5-20251001" }
judge_1 = { model = "claude-haiku-4-5-20251001" }
judge_2 = { model = "gpt-6-luna", effort = "low" }
pairwise = { model = "claude-haiku-4-5-20251001" }
flows_editor = { model = "claude-sonnet-5-5", effort = "low" }
