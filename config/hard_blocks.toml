# Taps the agent never makes: a control whose text or label holds one of these, or whose id does unless they hold a
# real word, as whole words in any case. A one-word entry counts only in a label of at most four words or one it
# starts, so prose that says "like" is no Like button. On text that is no control (a heading, a row, an article), a
# one-word entry counts only opening a label of at most four words, and a phrase only in one of at most six or opening
# it: a masthead such as "The Evening Post" and a headline that mentions a phone number are content. Generic English
# only, no app's names or terms. Sign-in isn't here: Google sign-in is allowed. Subscribe, upgrade and free trial
# aren't either: they go through Play billing, whose screen gets BACK at once, and tapping them is how the agent finds
# the price.
words = [
    # account deletion or deactivation
    "deactivate", "account deletion", "account removal", "account closure",
    # email, phone, profile and security changes (password, 2fa and recovery are in patterns below)
    "change email", "update email", "edit email", "change phone", "update phone", "edit phone",
    "phone number", "edit profile", "change username", "reset username", "profile photo", "profile picture",
    "make profile public", "make profile private",
    # sign-out
    "sign out", "signout", "log out", "logout", "log off",
    # public post, publish or share
    "post", "repost", "publish", "share",
    # actions toward other people under the account's name
    "invite", "follow", "unfollow", "like", "unlike", "react", "report", "block", "send request", "accept request",
    "friend request", "add friend",
    # purchases inside the app
    "buy now", "place order", "pay", "pay now", "checkout", "confirm purchase", "complete purchase", "purchase",
    "send gift", "tip",
]
# over the text as lowercase words with single spaces, counted like the phrases: a deletion verb, up to four words, then
# the account ("Delete your Example App account"); a change verb, up to three words, then a security noun ("Change the
# password", "Enable 2FA"), so a settings row that only names one ("Security & password") or a fitness "Recovery"
# tab is no change
patterns = ['(?:delete|remove|close|deactivate|disable|terminate)(?: \w+){0,4} (?:account|profile)',
            '(?:change|reset|update|edit|set|enable|disable|turn on|turn off|remove|forgot|create)(?: \w+){0,3} (?:password|2 ?fa|two factor|two step|recovery)']
# refused outside the core loop, the one place the agent sends its fixed text to an AI
outside_core = ["send", "submit", "reply", "add comment", "post comment", "send message"]
# refused while the dialog around it names a refused action: the commit of that action
confirm = ["confirm", "yes", "ok", "delete", "remove", "proceed", "i understand"]
