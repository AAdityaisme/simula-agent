name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]  # only makes and names the legs; each leg's split comes from the matrix itself
    env:
      PYTEST_SHARD: ${{ strategy.job-index }}
      PYTEST_SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m "not live" -q --durations=50

  # The gate scripts read the check named pytest; it passes only when every shard did.
  pytest:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SHARDS: ${{ needs.shard.result }}
        run: test "$SHARDS" = success
