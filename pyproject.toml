[project]
name = "simula-agent"
version = "0.1.0"
description = "Mobile app -> product model -> 1:1 mock -> rewarded-ad proposal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openai",
    "mcp==2.2.0",
    "pydantic>=2.12",
    "pillow",
    "numpy",
    "scikit-image",
    "pixelmatch",
    "playwright==1.63.0",
    "python-dotenv",
    "typesafe-sdk",
    "system-one-adapter[anthropic] @ git+https://github.com/typesafe-ai/system-one-adapter-python@e1d4cc9",
]

[project.scripts]
simula = "simula.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["simula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs API keys or the emulator; skipped in CI"]
